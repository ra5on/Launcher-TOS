<!doctype html><html lang="de"><head><meta charset="utf-8"><title>Übersicht</title>
<style>
@font-face { font-family:"Inter"; src:url("../assets/fonts/Inter-Variable-latin.woff2") format("woff2"); font-weight:100 900; }
*{margin:0;padding:0;box-sizing:border-box}
body{width:1100px;background:#0E121A;color:#fff;font-family:Inter,sans-serif;padding:28px}
h1{font-size:28px;font-weight:700;margin-bottom:4px} .s{color:#9aa3b5;font-size:15px;margin-bottom:22px}
.g{display:grid;grid-template-columns:repeat(5,1fr);gap:18px 16px}
figure img{width:100%;border-radius:16px;display:block;border:1px solid #2a3040}
figcaption{font-size:13px;color:#c8cfdc;margin-top:6px;font-weight:550}
</style></head><body>
<h1>Launcher-Vorlagen · Arbeitstitel „Klar“</h1><div class="s">15 Bildschirme · eigene Optik · Platzhalter-Icons (im Launcher: Original-Icons)</div>
<div class="g" id="g"></div>
<script>
const L=[["01-homescreen","Homescreen"],["02-ordner","Ordner"],["03-benachrichtigungen","Benachrichtigungen ↘ oben links"],["04-schnellzugriff","Schnellzugriff ↙ oben rechts"],["05-schnellzugriff-verbindungen","Schnellzugriff · Verbindungen"],["06-schnellzugriff-medien","Schnellzugriff · Medien"],["07-schnellzugriff-bearbeiten","Schnellzugriff bearbeiten"],["08-seiten-verwalten","Seiten entfernen"],["09-app-uebersicht","App-Übersicht"],["10-app-liste-suche","Suche + A–Z"],["11-einstellungen","Einstellungen · Darstellung"],["12-bearbeitungsmodus","Bearbeitungsmodus"],["13-widget-seite","Widget-Seite"],["14-einstellungen-uebersicht","Einstellungen"],["15-einstellungen-icons","Einstellungen · Icons"]];
document.getElementById("g").innerHTML=L.map(([f,t])=>`<figure><img src="../export/screens/${f}.png"><figcaption>${t}</figcaption></figure>`).join("");
</script></body></html>
