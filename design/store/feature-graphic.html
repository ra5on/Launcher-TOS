<!doctype html><html lang="de"><head><meta charset="utf-8">
<title>Feature-Grafik</title>
<!-- Play-Store-Feature-Grafik 1024 × 500. APP_NAME unten anpassen. -->
<style>
  @font-face { font-family:"Inter"; src:url("../assets/fonts/Inter-Variable-latin.woff2") format("woff2"); font-weight:100 900; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { width:1024px; height:500px; overflow:hidden; }
  body { font-family:"Inter",sans-serif; font-feature-settings:"cv11","ss01"; color:#fff; -webkit-font-smoothing:antialiased; position:relative;
    background: radial-gradient(60% 80% at 0% 0%, #2EC4A6 0%, transparent 65%), radial-gradient(55% 90% at 100% 100%, #7A4BA8 0%, transparent 70%), radial-gradient(40% 60% at 70% 0%, #F0A86A 0%, transparent 70%), #13223A; }
  .txt { position:absolute; left:72px; top:50%; transform:translateY(-50%); width:470px; }
  .name { font-size:84px; font-weight:780; letter-spacing:-3px; line-height:1; }
  .tag { font-size:28px; font-weight:560; margin-top:18px; line-height:1.25; color:rgba(255,255,255,.9); }
  .sub { font-size:18px; margin-top:16px; color:rgba(255,255,255,.7); font-weight:500; }
  .phone { position:absolute; top:60px; width:230px; height:510px; border-radius:36px; background:#0A0D12; padding:7px; box-shadow:0 30px 70px rgba(0,0,0,.5), 0 0 0 1.5px rgba(255,255,255,.14); }
  .phone img { width:100%; height:100%; border-radius:29px; object-fit:cover; object-position:top; display:block; }
  .p1 { left:590px; transform:rotate(-6deg); top:70px; }
  .p2 { left:770px; transform:rotate(5deg); top:40px; }
</style></head>
<body>
  <div class="txt">
    <div class="name" id="n">Launcher TOS</div>
    <div class="tag">Der Homescreen, der sich vertraut anfühlt</div>
    <div class="sub">Einfach umsteigen · fast alles einstellbar</div>
  </div>
  <div class="phone p1"><img src="../export/screens/01-homescreen.png" alt=""></div>
  <div class="phone p2"><img src="../export/screens/04-schnellzugriff.png" alt=""></div>
  <script>const APP_NAME = new URLSearchParams(location.search).get("name"); if (APP_NAME) document.getElementById("n").textContent = APP_NAME;</script>
</body></html>
