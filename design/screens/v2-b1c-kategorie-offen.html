<!doctype html><html lang="de"><head><meta charset="utf-8">
<title>Kategorie offen</title>
<link rel="stylesheet" href="../assets/kit.css">
<style>
  .panel { position:absolute; left:20px; right:20px; top:150px; border-radius:30px; padding:20px 16px 22px; background:rgba(20,26,36,.62); border:1px solid rgba(255,255,255,.16); backdrop-filter:var(--blur); }
  .head { display:flex; justify-content:space-between; align-items:baseline; margin:0 4px 18px; }
  .name { font-size:22px; font-weight:680; } .count { font-size:12.5px; color:var(--ink-2); }
  .apps { display:grid; grid-template-columns:repeat(3,1fr); row-gap:18px; justify-items:center; }
  .hint { position:absolute; left:0; right:0; top:640px; text-align:center; font-size:12.5px; color:var(--ink-2); }
</style></head>
<body>
<div class="wall blurred dim"></div>
<div class="layer">
  <div class="panel">
    <div class="head"><div class="name">Produktivität</div><div class="count">9 Apps</div></div>
    <div class="apps">
      <div data-app="kalender"></div><div data-app="mail"></div><div data-app="notizen"></div>
      <div data-app="aufgaben"></div><div data-app="dateien"></div><div data-app="rechner"></div>
      <div data-app="uhr"></div><div data-app="sprache"></div><div data-app="geld"></div>
    </div>
  </div>
  <div class="hint">Antippen öffnet die App · daneben tippen schließt</div>
</div>
<script src="../assets/kit.js"></script>
</body></html>
