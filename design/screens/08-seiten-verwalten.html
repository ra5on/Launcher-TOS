<!doctype html><html lang="de"><head><meta charset="utf-8">
<title>Seiten verwalten</title>
<link rel="stylesheet" href="../assets/kit.css">
<style>
  .head { position:absolute; top:50px; left:var(--side); right:var(--side); }
  .head .h-sub { margin-top:4px; }
  .pages { position:absolute; top:128px; left:28px; right:28px; display:grid; grid-template-columns:1fr 1fr; gap:22px 20px; }
  .pg { display:flex; flex-direction:column; align-items:center; gap:9px; position:relative; }
  .thumb { width:100%; height:222px; border-radius:22px; padding:12px 10px; display:flex; flex-direction:column; gap:6px; position:relative; }
  .thumb .minus { width:26px; height:26px; top:-9px; left:-9px; }
  .thumb .minus i { width:15px; height:15px; }
  .pg .name { font-size:13px; font-weight:600; }
  .pg .name small { display:block; text-align:center; font-size:11px; font-weight:500; color:var(--ink-3); margin-top:1px; }
  .b { background:rgba(255,255,255,.18); border-radius:8px; }
  .b.acc { background:var(--accent); }
  .b.w { background:rgba(255,255,255,.85); }
  .row { display:flex; gap:6px; }
  .sqs { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; }
  .sqs span { aspect-ratio:1; border-radius:7px; background:rgba(255,255,255,.18); }
  .sqs span.acc { background:var(--accent); }
  .lines { display:flex; flex-direction:column; gap:5px; }
  .lines span { height:16px; border-radius:6px; background:rgba(255,255,255,.16); display:flex; align-items:center; padding:0 5px; gap:5px; }
  .lines span::before { content:""; width:8px; height:8px; border-radius:3px; background:rgba(255,255,255,.5); }
  .lines span.on::after { content:""; margin-left:auto; width:14px; height:8px; border-radius:4px; background:var(--accent); }
  .pg.cur .thumb { outline:2px solid rgba(255,255,255,.75); outline-offset:3px; }
  .add .thumb { border:1.5px dashed rgba(255,255,255,.4); background:rgba(255,255,255,.05); align-items:center; justify-content:center; gap:10px; }
  .add .thumb .plus { width:44px; height:44px; border-radius:15px; background:rgba(255,255,255,.16); display:grid; place-items:center; }
  .add .thumb .plus i { width:22px; height:22px; }
  .add .thumb b { font-size:13px; font-weight:600; }
  .hint { position:absolute; bottom:92px; left:var(--side); right:var(--side); display:flex; justify-content:center; gap:7px; align-items:center; font-size:12.5px; color:var(--ink-2); }
  .hint i { width:15px; height:15px; }
  .bottom { position:absolute; bottom:34px; left:0; right:0; display:flex; justify-content:center; }
</style></head>
<body data-time="08:15">
<div class="wall blurred dim"></div>
<div class="layer">
  <div class="head">
    <div class="h-title">Seiten</div>
    <div class="h-sub">Schnellzugriff · 3 Seiten</div>
  </div>

  <div class="pages">
    <div class="pg cur">
      <div class="thumb glass"><div class="minus"><i data-i="minus"></i></div>
        <div class="row"><div class="b acc" style="height:22px;flex:1"></div><div class="b acc" style="height:22px;flex:1"></div><div class="b" style="height:22px;flex:1"></div><div class="b" style="height:22px;flex:1"></div></div>
        <div class="b" style="height:34px"></div>
        <div class="b" style="height:14px;background:linear-gradient(90deg,rgba(255,255,255,.85) 64%,rgba(255,255,255,.18) 64%)"></div>
        <div class="b" style="height:14px;background:linear-gradient(90deg,rgba(255,255,255,.85) 42%,rgba(255,255,255,.18) 42%)"></div>
        <div class="sqs" style="margin-top:4px"><span></span><span class="acc"></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
      </div>
      <div class="name">Steuerung<small>14 Elemente</small></div>
    </div>

    <div class="pg">
      <div class="thumb glass"><div class="minus"><i data-i="minus"></i></div>
        <div class="lines"><span class="on"></span><span class="on"></span><span></span><span></span><span></span></div>
        <div class="lines" style="margin-top:6px"><span class="on"></span><span class="on"></span><span></span></div>
      </div>
      <div class="name">Verbindungen<small>8 Elemente</small></div>
    </div>

    <div class="pg">
      <div class="thumb glass"><div class="minus"><i data-i="minus"></i></div>
        <div class="b" style="height:84px;background:linear-gradient(150deg,#E8607A,#33245F)"></div>
        <div class="b w" style="height:8px;width:70%"></div>
        <div class="b" style="height:6px;width:50%"></div>
        <div class="b" style="height:4px;margin-top:4px;background:linear-gradient(90deg,#fff 38%,rgba(255,255,255,.2) 38%)"></div>
        <div style="display:flex;justify-content:center;margin-top:4px"><div class="b w" style="width:22px;height:22px;border-radius:50%"></div></div>
        <div class="b" style="height:22px;margin-top:auto"></div>
      </div>
      <div class="name">Medien<small>2 Elemente</small></div>
    </div>

    <div class="pg add">
      <div class="thumb"><div class="plus"><i data-i="plus"></i></div><b>Neue Seite</b></div>
      <div class="name">&nbsp;<small>&nbsp;</small></div>
    </div>
  </div>

  <div class="hint"><i data-i="hand"></i>Seiten entfernen oder per Ziehen umsortieren</div>
  <div class="bottom"><div class="done-btn"><i data-i="check"></i>Fertig</div></div>
</div>
<script src="../assets/kit.js"></script>
</body></html>
