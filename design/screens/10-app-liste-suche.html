<!doctype html><html lang="de"><head><meta charset="utf-8">
<title>App-Liste mit Suche</title>
<link rel="stylesheet" href="../assets/kit.css">
<style>
  .top { position:absolute; top:44px; left:var(--side); right:var(--side); display:flex; align-items:center; gap:12px; }
  .field { flex:1; height:42px; border-radius:21px; display:flex; align-items:center; gap:9px; padding:0 12px 0 15px;
    font-size:15px; font-weight:500; border:1.5px solid rgba(46,196,166,.75) !important; }
  .field i { width:18px; height:18px; color:var(--ink-2); }
  .field .caret { width:2px; height:19px; background:var(--accent); margin-left:-7px; border-radius:1px; }
  .field .clr { margin-left:auto; width:22px; height:22px; border-radius:50%; background:rgba(255,255,255,.22); display:grid; place-items:center; }
  .field .clr i { width:13px; height:13px; color:#fff; }
  .cancel { font-size:14.5px; font-weight:600; color:var(--accent); }
  .list { position:absolute; top:102px; left:var(--side); right:34px; bottom:0;
    -webkit-mask-image:linear-gradient(180deg,#000 76%,transparent 90%); mask-image:linear-gradient(180deg,#000 76%,transparent 90%); }
  .sec { display:flex; align-items:baseline; justify-content:space-between; margin:4px 4px 8px; }
  .sec span { font-size:12px; color:var(--ink-3); font-weight:550; }
  .card { border-radius:var(--r-card); padding:4px 12px; margin-bottom:14px; }
  .item { display:flex; align-items:center; gap:12px; height:54px; border-bottom:1px solid rgba(255,255,255,.08); }
  .item:last-child { border-bottom:0; }
  .item .t { font-size:15px; font-weight:500; }
  .item .t em { font-style:normal; font-weight:750; color:var(--accent); }
  .item .s { font-size:12px; color:var(--ink-3); margin-top:1px; }
  .item .go { margin-left:auto; width:16px; height:16px; color:var(--ink-3); }
  .letter { font-size:13px; font-weight:700; color:var(--ink-2); margin:2px 6px 4px; }
  .az { position:absolute; top:150px; right:8px; width:18px; display:flex; flex-direction:column; align-items:center; gap:2.2px;
    font-size:9.5px; font-weight:650; color:var(--ink-2); }
  .az b { color:var(--accent-ink); background:var(--accent); width:16px; height:16px; border-radius:8px; display:grid; place-items:center; font-size:9.5px; }
  .hint { position:absolute; bottom:30px; left:0; right:0; display:flex; justify-content:center; }
  .hint .glass { display:flex; align-items:center; gap:7px; height:32px; padding:0 14px; border-radius:16px; font-size:12px; color:var(--ink-2); font-weight:500; }
  .hint i { width:14px; height:14px; color:var(--accent); }
</style></head>
<body data-time="08:15">
<div class="wall blurred dim"></div>
<div class="layer">
  <div class="top">
    <div class="field glass strong"><i data-i="search"></i>ka<span class="caret"></span>
      <div class="clr"><i data-i="x"></i></div></div>
    <div class="cancel">Abbrechen</div>
  </div>

  <div class="list">
    <div class="sec"><div class="section-label">Treffer</div><span>4 Apps</span></div>
    <div class="card glass">
      <div class="item"><div data-tile="kalender" data-size="40"></div><div><div class="t"><em>Ka</em>lender</div><div class="s">Produktivität</div></div><i data-i="chevron-right" class="go"></i></div>
      <div class="item"><div data-tile="kamera" data-size="40"></div><div><div class="t"><em>Ka</em>mera</div><div class="s">Fotos &amp; Video</div></div><i data-i="chevron-right" class="go"></i></div>
      <div class="item"><div data-tile="karten" data-size="40"></div><div><div class="t"><em>Ka</em>rten</div><div class="s">Unterwegs</div></div><i data-i="chevron-right" class="go"></i></div>
      <div class="item"><div data-tile="kontakte" data-size="40"></div><div><div class="t"><em>K</em>ont<em>a</em>kte</div><div class="s">Ähnlicher Treffer</div></div><i data-i="chevron-right" class="go"></i></div>
    </div>

    <div class="sec"><div class="section-label">Alle Apps</div><span>A–Z</span></div>
    <div class="letter">A</div>
    <div class="card glass">
      <div class="item"><div data-tile="aufgaben" data-size="40"></div><div class="t">Aufgaben</div></div>
      <div class="item"><div data-tile="auto" data-size="40"></div><div class="t">Auto</div></div>
    </div>
    <div class="letter">B</div>
    <div class="card glass">
      <div class="item"><div data-tile="bahn" data-size="40"></div><div class="t">Bahn</div></div>
      <div class="item"><div data-tile="bank" data-size="40"></div><div class="t">Banking</div></div>
      <div class="item"><div data-tile="browser" data-size="40"></div><div class="t">Browser</div></div>
    </div>
    <div class="letter">C</div>
    <div class="card glass">
      <div class="item"><div data-tile="chat" data-size="40"></div><div class="t">Chat</div></div>
    </div>
  </div>

  <div class="az">
    <span>A</span><span>B</span><span>C</span><span>D</span><span>E</span><span>F</span><span>G</span><span>H</span><span>I</span><span>J</span><b>K</b><span>L</span><span>M</span><span>N</span><span>O</span><span>P</span><span>Q</span><span>R</span><span>S</span><span>T</span><span>U</span><span>V</span><span>W</span><span>X</span><span>Y</span><span>Z</span><span>#</span>
  </div>

  <div class="hint"><div class="glass"><i data-i="sparkles"></i>Findet Apps auch bei Tippfehlern</div></div>
</div>
<script src="../assets/kit.js"></script>
</body></html>
