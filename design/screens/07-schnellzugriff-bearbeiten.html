<!doctype html><html lang="de"><head><meta charset="utf-8">
<title>Schnellzugriff bearbeiten</title>
<link rel="stylesheet" href="../assets/kit.css">
<style>
  .head { position:absolute; top:44px; left:var(--side); right:var(--side); display:flex; align-items:center; gap:10px; }
  .head .tx b { display:block; font-size:17px; font-weight:680; letter-spacing:-.2px; }
  .head .tx span { display:block; font-size:12px; color:var(--ink-2); margin-top:1px; }
  .head .pill-btn { margin-left:auto; flex:none; }
  .content { position:absolute; top:100px; left:var(--side); right:var(--side); display:flex; flex-direction:column; gap:12px; }
  .el { position:relative; }
  .card { border-radius:24px; padding:14px; }
  .conn { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; padding:14px 10px 12px; }
  .tg { display:flex; flex-direction:column; align-items:center; gap:7px; text-align:center; }
  .tg .sq { width:56px; height:56px; border-radius:18px; background:rgba(255,255,255,.14); display:grid; place-items:center; }
  .tg .sq i { width:22px; height:22px; }
  .tg.on .sq { background:var(--accent); color:var(--accent-ink); }
  .tg b { font-size:11px; font-weight:600; display:block; white-space:nowrap; }
  .media { display:flex; gap:12px; align-items:center; outline:2px solid var(--accent); outline-offset:3px; }
  .cover { width:66px; height:66px; border-radius:16px; flex:none; position:relative; overflow:hidden;
    background:radial-gradient(80% 80% at 25% 20%, #FFC18A 0%, transparent 60%), radial-gradient(90% 90% at 85% 85%, #7B5CFF 0%, transparent 65%), linear-gradient(140deg,#E8607A,#3B2A6E); }
  .media .meta { flex:1; min-width:0; }
  .media .mt { font-size:14.5px; font-weight:650; }
  .media .a { font-size:12px; color:var(--ink-2); margin-top:1px; }
  .ctrl { display:flex; align-items:center; gap:18px; margin-top:8px; }
  .ctrl i { width:20px; height:20px; }
  .ctrl .play { width:34px; height:34px; border-radius:50%; background:#fff; color:#10141C; display:grid; place-items:center; }
  .ctrl .play i { width:16px; height:16px; }
  .sizebar { position:absolute; right:6px; bottom:-30px; z-index:6; display:flex; align-items:center; gap:4px; padding:4px 4px 4px 12px;
    border-radius:var(--r-pill); background:rgba(16,20,28,.86); border:1px solid rgba(255,255,255,.16); box-shadow:0 10px 24px rgba(0,0,0,.35); font-size:12.5px; font-weight:600; }
  .sizebar .lab { color:var(--ink-2); margin-right:4px; }
  .sizebar .s { width:30px; height:28px; border-radius:var(--r-pill); display:grid; place-items:center; color:var(--ink-2); }
  .sizebar .s.on { background:var(--accent); color:var(--accent-ink); }
  .sl { height:52px; border-radius:26px; position:relative; overflow:hidden; }
  .sl .fill { position:absolute; left:0; top:0; bottom:0; background:rgba(255,255,255,.9); border-radius:26px 6px 6px 26px; }
  .sl .in { position:relative; height:100%; display:flex; align-items:center; gap:10px; padding:0 18px; }
  .sl .in i { width:20px; height:20px; color:#10141C; }
  .sl .in b { font-size:13.5px; font-weight:600; color:#10141C; }
  .slwrap { position:relative; }
  .tiles { display:grid; grid-template-columns:repeat(4,1fr); row-gap:14px; margin-top:4px; justify-items:center; }
  .t { display:flex; flex-direction:column; align-items:center; gap:6px; position:relative; }
  .t .sq { width:62px; height:62px; border-radius:20px; display:grid; place-items:center; }
  .t .sq i { width:24px; height:24px; }
  .t.on .sq { background:var(--accent); color:var(--accent-ink); border-color:transparent; }
  .t span { font-size:11px; font-weight:550; text-shadow:0 1px 3px rgba(0,0,0,.35); white-space:nowrap; }
  .t .minus { top:-7px; left:-7px; }
  .empty { width:62px; height:62px; border-radius:20px; border:1.5px dashed rgba(255,255,255,.35); }
  .bottom { position:absolute; bottom:30px; left:var(--side); right:var(--side); display:flex; align-items:center; justify-content:space-between; }
  .bottom .pill-btn { height:36px; padding:0 15px; font-size:13.5px; }
</style></head>
<body data-time="08:15">
<div class="wall blurred dim"></div>
<div class="layer">
  <div class="head">
    <div class="tx"><b>Steuerung bearbeiten</b><span>Ziehen zum Verschieben</span></div>
    <div class="pill-btn glass"><i data-i="layout-grid"></i>Seiten</div>
  </div>

  <div class="content">
    <div class="el wob3"><div class="minus"><i data-i="minus"></i></div>
      <div class="card glass conn">
        <div class="tg on"><div class="sq"><i data-i="wifi"></i></div><b>WLAN</b></div>
        <div class="tg on"><div class="sq"><i data-i="bluetooth"></i></div><b>Bluetooth</b></div>
        <div class="tg"><div class="sq"><i data-i="signal-high"></i></div><b>Mobile Daten</b></div>
        <div class="tg"><div class="sq"><i data-i="plane"></i></div><b>Flugmodus</b></div>
      </div>
    </div>

    <div class="el wob2" style="z-index:8"><div class="minus"><i data-i="minus"></i></div>
      <div class="card glass media">
        <div class="cover"></div>
        <div class="meta"><div class="mt">Leuchtfeuer am Hafen</div><div class="a">Nordlicht Quartett</div>
          <div class="ctrl"><i data-i="skip-back"></i><div class="play"><i data-i="pause"></i></div><i data-i="skip-forward"></i></div></div>
      </div>
      <div class="sizebar"><span class="lab">Größe</span><span class="s">S</span><span class="s on">M</span><span class="s">L</span></div>
    </div>

    <div class="el wob1" style="margin-top:20px"><div class="minus"><i data-i="minus"></i></div>
      <div class="sl glass"><div class="fill" style="width:64%"></div><div class="in"><i data-i="sun"></i><b>Helligkeit</b></div></div></div>
    <div class="el wob3"><div class="minus"><i data-i="minus"></i></div>
      <div class="sl glass"><div class="fill" style="width:42%"></div><div class="in"><i data-i="volume-2"></i><b>Lautstärke</b></div></div></div>

    <div class="tiles">
      <div class="t wob2"><div class="minus"><i data-i="minus"></i></div><div class="sq glass"><i data-i="flashlight"></i></div><span>Taschenlampe</span></div>
      <div class="t on wob1"><div class="minus"><i data-i="minus"></i></div><div class="sq glass"><i data-i="moon"></i></div><span>Nicht stören</span></div>
      <div class="t wob3"><div class="minus"><i data-i="minus"></i></div><div class="sq glass"><i data-i="calculator"></i></div><span>Rechner</span></div>
      <div class="t wob2"><div class="minus"><i data-i="minus"></i></div><div class="sq glass"><i data-i="camera"></i></div><span>Kamera</span></div>
      <div class="t wob1"><div class="minus"><i data-i="minus"></i></div><div class="sq glass"><i data-i="alarm-clock"></i></div><span>Wecker</span></div>
      <div class="t wob3"><div class="minus"><i data-i="minus"></i></div><div class="sq glass"><i data-i="battery-charging"></i></div><span>Energiesparen</span></div>
      <div class="t"><div class="empty"></div></div>
      <div class="t"><div class="empty"></div></div>
    </div>
  </div>

  <div class="bottom">
    <div class="pill-btn glass"><i data-i="plus"></i>Element hinzufügen</div>
    <div class="done-btn"><i data-i="check"></i>Fertig</div>
  </div>
</div>
<script src="../assets/kit.js"></script>
</body></html>
