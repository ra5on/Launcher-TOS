<!doctype html><html lang="de"><head><meta charset="utf-8">
<title>Ordner</title>
<link rel="stylesheet" href="../assets/kit.css">
<style>
  .panel { position:absolute; left:28px; right:28px; top:212px; border-radius:30px; padding:22px 18px 24px; }
  .head { display:flex; align-items:center; justify-content:space-between; margin-bottom:22px; padding:0 4px; }
  .name { display:flex; align-items:center; gap:8px; font-size:22px; font-weight:680; letter-spacing:-.4px; }
  .name i { width:16px; height:16px; color:var(--ink-2); }
  .count { font-size:12.5px; color:var(--ink-2); font-weight:550; }
  .apps { display:grid; grid-template-columns:repeat(3,1fr); row-gap:20px; justify-items:center; }
  .hint { position:absolute; left:0; right:0; top:612px; text-align:center; font-size:12.5px; color:var(--ink-2); }
</style></head>
<body>
<div class="wall blurred dim"></div>
<div class="layer">
  <div class="panel glass">
    <div class="head">
      <div class="name">Werkzeuge <i data-i="pencil"></i></div>
      <div class="count">6 Apps</div>
    </div>
    <div class="apps">
      <div data-app="rechner"></div>
      <div data-app="uhr"></div>
      <div data-app="dateien"></div>
      <div data-app="kontakte"></div>
      <div data-app="sprache"></div>
      <div data-app="geld"></div>
    </div>
  </div>
  <div class="hint">Name antippen zum Umbenennen</div>
</div>
<script src="../assets/kit.js"></script>
</body></html>
